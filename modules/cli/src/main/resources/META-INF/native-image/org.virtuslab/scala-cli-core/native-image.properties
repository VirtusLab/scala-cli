# The jimfs FileSystemProvider ends up in the image heap (installed providers are loaded at build time),
# along with the Guava internals backing its static file system cache.
# Features decide on their own whether they apply to the current platform (see their isInConfiguration).
# svm internals used by our substitutions & features are only exported to GraalVM's own modules.
# sun.misc.Unsafe picks its memory access mode at build time; allowing it silences the JDK 24+
# (JEP 498) warnings that lazy vals from dependencies compiled with Scala < 3.8 would trigger at run time.
# Enabling native access silences the JDK 24+ (JEP 472) warnings about libraries loading native code via JNI
# (like swoval, used for --watch). ALL-UNNAMED, as these libraries are on the class path (several of them
# load native code: swoval, zstd-jni, jna, …), and in a native image this only controls run time warnings.
Args = --no-fallback \
       --features=scala.cli.internal.CsJniUtilsFeature,scala.cli.internal.LibsodiumjniFeature \
       --enable-native-access=ALL-UNNAMED \
       --enable-url-protocols=http,https \
       --initialize-at-build-time=com.google.common.jimfs.SystemJimfsFileSystemProvider \
       --initialize-at-build-time=com.google.common.collect.MapMakerInternalMap \
       --initialize-at-build-time=com.google.common.collect.MapMakerInternalMap$1 \
       --initialize-at-build-time=com.google.common.collect.MapMakerInternalMap$StrongKeyWeakValueSegment \
       --initialize-at-build-time=com.google.common.collect.MapMakerInternalMap$StrongKeyWeakValueEntry$Helper \
       --initialize-at-build-time=com.google.common.base.Equivalence$Equals \
       --initialize-at-build-time=com.google.common.base.Preconditions \
       -H:IncludeResources=bootstrap.*.jar \
       -H:IncludeResources=coursier/coursier.properties \
       -H:IncludeResources=coursier/launcher/coursier.properties \
       -H:IncludeResources=coursier/launcher/.*.bat \
       -H:+ReportExceptionStackTraces \
       -Djdk.http.auth.tunneling.disabledSchemes=
JavaArgs = --sun-misc-unsafe-memory-access=allow \
           --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core=ALL-UNNAMED \
           --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core.jdk=ALL-UNNAMED \
           --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core.posix.headers=ALL-UNNAMED \
           --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.hosted=ALL-UNNAMED \
           --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.hosted.c=ALL-UNNAMED
