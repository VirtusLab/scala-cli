name: macOS Native Tests
on:
  workflow_call:
    inputs:
      code:
        type: string
        required: true
      ci:
        type: string
        required: true
      mill_wrapper:
        type: string
        required: true
      test_all:
        type: string
        required: true
      test_native:
        type: string
        required: true
      test_skip:
        type: string
        required: true

jobs:
  generate-macos-launcher:
    timeout-minutes: 120
    runs-on: "macOS-15-intel"
    env:
      SHOULD_RUN: ${{ (inputs.code == 'true' || inputs.ci == 'true' || inputs.mill_wrapper == 'true' || inputs.test_all == 'true' || inputs.test_native == 'true') && inputs.test_skip != 'true' }}
    steps:
    - name: Log skip reason
      if: env.SHOULD_RUN != 'true'
      run: echo "Skipping macOS native launcher generation -- changes do not affect compiled code or CI."
    - uses: actions/checkout@v7
      if: env.SHOULD_RUN == 'true'
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
      if: env.SHOULD_RUN == 'true'
      with:
        ignoreJob: true
    - uses: VirtusLab/scala-cli-setup@v1
      if: env.SHOULD_RUN == 'true'
      with:
        jvm: "temurin:17"
    - name: Ensure it's not running on aarch64
      if: env.SHOULD_RUN == 'true'
      run: scala-cli -e 'assert(System.getProperty("os.arch") != "aarch64")'
    - name: Generate native launcher
      if: env.SHOULD_RUN == 'true'
      run: .github/scripts/generate-native-image.sh
    - run: ./mill -i ci.setShouldPublish
      if: env.SHOULD_RUN == 'true'
    - name: Build OS packages
      if: env.SHOULD_PUBLISH == 'true' && env.SHOULD_RUN == 'true'
      run: .github/scripts/generate-os-packages.sh
    - name: Copy artifacts
      if: env.SHOULD_RUN == 'true'
      run: ./mill -i copyDefaultLauncher --directory artifacts/
    - uses: actions/upload-artifact@v7
      if: env.SHOULD_RUN == 'true'
      with:
        name: macos-launchers
        path: artifacts/
        if-no-files-found: error
        retention-days: 2

  native-macos-tests-default:
    needs: [generate-macos-launcher]
    timeout-minutes: 45
    runs-on: "macOS-15-intel"
    env:
      SHOULD_RUN: ${{ (inputs.code == 'true' || inputs.ci == 'true' || inputs.mill_wrapper == 'true' || inputs.test_all == 'true' || inputs.test_native == 'true') && inputs.test_skip != 'true' }}
    steps:
    - name: Log skip reason
      if: env.SHOULD_RUN != 'true'
      run: echo "Skipping native macOS integration tests (sanity) -- changes do not affect compiled code or CI."
    - uses: actions/checkout@v7
      if: env.SHOULD_RUN == 'true'
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
      if: env.SHOULD_RUN == 'true'
      with:
        ignoreJob: true
    - uses: VirtusLab/scala-cli-setup@v1
      if: env.SHOULD_RUN == 'true'
      with:
        jvm: "temurin:17"
    - name: Ensure it's not running on aarch64
      if: env.SHOULD_RUN == 'true'
      run: scala-cli -e 'assert(System.getProperty("os.arch") != "aarch64")'
    - uses: actions/download-artifact@v8
      if: env.SHOULD_RUN == 'true'
      with:
        name: macos-launchers
        path: artifacts/
    - name: Native integration tests
      if: env.SHOULD_RUN == 'true'
      run: ./mill -i nativeIntegrationTests
      env:
        UPDATE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SCALA_CLI_IT_FORCED_LAUNCHER_DIRECTORY: artifacts/
        SCALA_CLI_IT_GROUP: 1
        SCALA_CLI_IT_SANITY: true
        SCALA_CLI_SODIUM_JNI_ALLOW: false
    - name: Convert Mill test reports to JUnit XML format
      if: (success() || failure()) && env.SHOULD_RUN == 'true'
      run: .github/scripts/generate-junit-reports.sc macos-tests-default 'Scala CLI MacOS Tests (sanity)' test-report.xml out/
    - name: Upload test report
      uses: actions/upload-artifact@v7
      if: (success() || failure()) && env.SHOULD_RUN == 'true'
      with:
        name: test-results-macos-tests-default
        path: test-report.xml

  native-macos-tests-rc:
    needs: [generate-macos-launcher]
    timeout-minutes: 45
    runs-on: "macOS-15-intel"
    env:
      SHOULD_RUN: ${{ (inputs.code == 'true' || inputs.ci == 'true' || inputs.mill_wrapper == 'true' || inputs.test_all == 'true' || inputs.test_native == 'true') && inputs.test_skip != 'true' }}
    steps:
      - name: Log skip reason
        if: env.SHOULD_RUN != 'true'
        run: echo "Skipping native macOS integration tests (sanity) -- changes do not affect compiled code or CI."
      - uses: actions/checkout@v7
        if: env.SHOULD_RUN == 'true'
        with:
          fetch-depth: 0
          submodules: true
      - uses: coursier/cache-action@v8
        if: env.SHOULD_RUN == 'true'
        with:
          ignoreJob: true
      - uses: VirtusLab/scala-cli-setup@v1
        if: env.SHOULD_RUN == 'true'
        with:
          jvm: "temurin:17"
      - name: Ensure it's not running on aarch64
        if: env.SHOULD_RUN == 'true'
        run: scala-cli -e 'assert(System.getProperty("os.arch") != "aarch64")'
      - uses: actions/download-artifact@v8
        if: env.SHOULD_RUN == 'true'
        with:
          name: macos-launchers
          path: artifacts/
      - name: Native integration tests
        if: env.SHOULD_RUN == 'true'
        run: ./mill -i nativeIntegrationTests
        env:
          UPDATE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCALA_CLI_IT_FORCED_LAUNCHER_DIRECTORY: artifacts/
          SCALA_CLI_IT_GROUP: 5
          SCALA_CLI_IT_SANITY: true
          SCALA_CLI_SODIUM_JNI_ALLOW: false
      - name: Convert Mill test reports to JUnit XML format
        if: (success() || failure()) && env.SHOULD_RUN == 'true'
        run: .github/scripts/generate-junit-reports.sc macos-tests-rc 'Scala CLI MacOS Tests (sanity)' test-report.xml out/
      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: (success() || failure()) && env.SHOULD_RUN == 'true'
        with:
          name: test-results-macos-tests-rc
          path: test-report.xml

  generate-macos-arm64-launcher:
    timeout-minutes: 120
    runs-on: "macOS-15"
    env:
      SHOULD_RUN: ${{ (inputs.code == 'true' || inputs.ci == 'true' || inputs.mill_wrapper == 'true' || inputs.test_all == 'true' || inputs.test_native == 'true') && inputs.test_skip != 'true' }}
    steps:
      - name: Log skip reason
        if: env.SHOULD_RUN != 'true'
        run: echo "Skipping macOS ARM64 native launcher generation -- changes do not affect compiled code or CI."
      - uses: actions/checkout@v7
        if: env.SHOULD_RUN == 'true'
        with:
          fetch-depth: 0
          submodules: true
      - uses: coursier/cache-action@v8
        if: env.SHOULD_RUN == 'true'
        with:
          ignoreJob: true
      - uses: VirtusLab/scala-cli-setup@v1
        if: env.SHOULD_RUN == 'true'
        with:
          jvm: "https://github.com/graalvm/graalvm-ce-builds/releases/download/vm-22.2.0/graalvm-ce-java17-darwin-aarch64-22.2.0.tar.gz"
      - name: Ensure it's running on aarch64
        if: env.SHOULD_RUN == 'true'
        run: scala-cli -e 'assert(System.getProperty("os.arch") == "aarch64")'
      - name: Generate native launcher
        if: env.SHOULD_RUN == 'true'
