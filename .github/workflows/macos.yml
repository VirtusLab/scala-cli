      - name: Log skip reason
        if: env.SHOULD_RUN != 'true'
        run: echo "Skipping native macOS ARM64 integration tests (sanity) -- changes do not affect compiled code or CI."
      - uses: actions/checkout@v7
        if: env.SHOULD_RUN == 'true'
        with:
          fetch-depth: 0
