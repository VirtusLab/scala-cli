name: Linux Native Tests
on:
  workflow_call:
    inputs:
      code:
        type: string
        required: true
      ci:
        type: string
        required: true
      mill_wrapper:
        type: string
        required: true
      test_all:
        type: string
        required: true
      test_native:
        type: string
        required: true
      test_skip:
        type: string
        required: true
      test_legacy_lts:
        type: string
        required: true
      test_lts_all_platforms:
        type: string
        required: true

jobs:
  generate-linux-launcher:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    outputs:
      should_publish: ${{ steps.should-publish.outputs.should_publish }}
    env:
      SHOULD_RUN: ${{ (inputs.code == 'true' || inputs.ci == 'true' || inputs.mill_wrapper == 'true' || inputs.test_all == 'true' || inputs.test_native == 'true') && inputs.test_skip != 'true' }}
    steps:
    - name: Log skip reason
      if: env.SHOULD_RUN != 'true'
      run: echo "Skipping Linux native launcher generation -- changes do not affect compiled code or CI."
    - uses: actions/checkout@v7
      if: env.SHOULD_RUN == 'true'
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
      if: env.SHOULD_RUN == 'true'
      with:
        ignoreJob: true
    - uses: VirtusLab/scala-cli-setup@v1
      if: env.SHOULD_RUN == 'true'
      with:
        jvm: "temurin:25"
    - name: Generate native launcher
      if: env.SHOULD_RUN == 'true'
      run: .github/scripts/generate-native-image.sh
    - run: ./mill -i ci.setShouldPublish
      if: env.SHOULD_RUN == 'true'
    - name: Expose SHOULD_PUBLISH
      id: should-publish
      if: env.SHOULD_RUN == 'true'
      run: echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
    - name: Build OS packages
      if: env.SHOULD_PUBLISH == 'true' && env.SHOULD_RUN == 'true'
      run: .github/scripts/generate-os-packages.sh
    - name: Copy artifacts
      if: env.SHOULD_RUN == 'true'
      run: ./mill -i copyDefaultLauncher --directory artifacts/
    - name: Verify native launcher CPU compatibility
      if: env.SHOULD_RUN == 'true'
      run: .github/scripts/verify_old_cpus.sh artifacts/scala-cli-x86_64-pc-linux.gz
    - uses: actions/upload-artifact@v7
      if: env.SHOULD_RUN == 'true'
      with:
        name: linux-launchers
        path: artifacts/
        if-no-files-found: error
        retention-days: 2

  test-linux-os-packages:
    needs: [generate-linux-launcher]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      SHOULD_RUN: ${{ needs.generate-linux-launcher.outputs.should_publish == 'true' }}
    steps:
    - name: Log skip reason
      if: env.SHOULD_RUN != 'true'
      run: echo "Skipping Linux OS package tests -- no OS packages were built."
    - uses: actions/checkout@v7
      if: env.SHOULD_RUN == 'true'
    - uses: actions/download-artifact@v8
      if: env.SHOULD_RUN == 'true'
      with:
        name: linux-launchers
        path: artifacts/
    - name: Test OS packages (.deb, .rpm)
      if: env.SHOULD_RUN == 'true'
      run: .github/scripts/test-os-packages.sh

  native-linux-tests-default:
    needs: [generate-linux-launcher]
    timeout-minutes: 150
    runs-on: ubuntu-24.04
    env:
      SHOULD_RUN: ${{ (inputs.code == 'true' || inputs.ci == 'true' || inputs.mill_wrapper == 'true' || inputs.test_all == 'true' || inputs.test_native == 'true') && inputs.test_skip != 'true' }}
    steps:
    - name: Log skip reason
      if: env.SHOULD_RUN != 'true'
      run: echo "Skipping native Linux integration tests (default) -- changes do not affect compiled code or CI."
    - uses: actions/checkout@v7
      if: env.SHOULD_RUN == 'true'
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
      if: env.SHOULD_RUN == 'true'
      with:
        ignoreJob: true
    - uses: VirtusLab/scala-cli-setup@v1
      if: env.SHOULD_RUN == 'true'
      with:
        jvm: "temurin:25"
    - uses: actions/download-artifact@v8
      if: env.SHOULD_RUN == 'true'
      with:
        name: linux-launchers
        path: artifacts/
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Native integration tests
      if: env.SHOULD_RUN == 'true'
      run: ./mill -i nativeIntegrationTests
      env:
        UPDATE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SCALA_CLI_IT_FORCED_LAUNCHER_DIRECTORY: artifacts/
        SCALA_CLI_IT_GROUP: 1
        SCALA_CLI_SODIUM_JNI_ALLOW: false
    - name: Convert Mill test reports to JUnit XML format
      if: (success() || failure()) && env.SHOULD_RUN == 'true'
      run: .github/scripts/generate-junit-reports.sc linux-tests-default 'Scala CLI Linux Tests (default)' test-report.xml out/
    - name: Upload test report
      uses: actions/upload-artifact@v7
      if: (success() || failure()) && env.SHOULD_RUN == 'true'
      with:
        name: test-results-linux-tests-default
        path: test-report.xml

