  generate-linux-arm64-native-launcher:
    timeout-minutes: 120
    runs-on: ubuntu-24.04-arm
    outputs:
      should_publish: ${{ steps.should-publish.outputs.should_publish }}
    env:
      SHOULD_RUN: ${{ (inputs.code == 'true' || inputs.ci == 'true' || inputs.mill_wrapper == 'true' || inputs.test_all == 'true' || inputs.test_native == 'true') && inputs.test_skip != 'true' }}
    steps:
